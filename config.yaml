# Central configuration. Every model shares these settings (fair comparison).
project:
  name: "Enhanced Machine Learning Framework for Short-Term Traffic Flow Forecasting"
  random_seed: 42

paths:
  raw_data: data/raw/pems04.npz
  results_dir: results
  models_dir: trained_models

dataset:
  name: PeMSD4
  interval_minutes: 5
  start_date: "2018-01-01"      # PeMSD4 covers 1 Jan - 28 Feb 2018 (dataset documentation)
  flow_feature_index: 0         # npz channels: 0 = flow, 1 = occupancy, 2 = speed

forecast:
  sequence_length: 12           # 12 x 5 min = 60 min of history (methodology default)
  horizon_steps: 3              # target = t + 3
  horizon_minutes: 15

split:                          # chronological, never shuffled
  train: 0.70
  validation: 0.15
  test: 0.15

preprocessing:
  zero_is_missing: true         # flow = 0 on a freeway detector = sensor failure
  max_interpolation_gap: 12     # fill gaps up to 12 steps (1 h); longer gaps are dropped

evaluation:
  mape_min_flow: 10             # MAPE only where actual flow >= 10 vehicles / 5 min

tuning:                         # small grid search, scored on the VALIDATION set only
  max_sensors: 40               # candidates are compared on the first 40 sensors to keep search affordable
  max_epochs: 8                 # epochs per deep-learning candidate during search

models:
  random_forest:
    fixed: {n_estimators: 100, max_samples: 0.1, n_jobs: -1}
    search: {max_depth: [10, 20], min_samples_leaf: [1, 5]}
  xgboost:
    fixed: {n_estimators: 1000, subsample: 0.8, colsample_bytree: 0.8, tree_method: hist, early_stopping_rounds: 30}
    search: {max_depth: [6, 8], learning_rate: [0.05, 0.1]}
  lstm:
    fixed: {dropout: 0.2, learning_rate: 0.001, batch_size: 1024, max_epochs: 25, patience: 5}
    search: {hidden_size: [32, 64], num_layers: [1, 2]}
  gru:
    fixed: {dropout: 0.2, learning_rate: 0.001, batch_size: 1024, max_epochs: 25, patience: 5}
    search: {hidden_size: [32, 64], num_layers: [1, 2]}
  hybrid:
    xgboost_fixed: {n_estimators: 1000, subsample: 0.8, colsample_bytree: 0.8, tree_method: hist, early_stopping_rounds: 30}
    xgboost_search: {max_depth: [6, 8], learning_rate: [0.05, 0.1]}

debug:                          # python run_pipeline.py --mode debug
  max_sensors: 5
  max_epochs: 3
  results_dir: results_debug          # debug output is kept apart and never reported as final
  models_dir: trained_models_debug
